manifestVersion: 1
id: aiacos-argon-one
storage:
  dataRoot: data
category: automation
name: Argon ONE
version: "1.0.0"
tagline: Fan curve and power button for the Argon ONE case on Raspberry Pi 5
icon: https://raw.githubusercontent.com/Aiacos/umbrel-app-store/main/aiacos-argon-one/icon.svg
description: >-
  Only for a Raspberry Pi 5 in an Argon ONE case. Not affiliated with Argon 40.


  Set when the fan starts and how fast it spins from a curve you can drag, see the temperature
  and fan speed, and use the case's power button to reboot or shut down.


  umbrelOS resets its system partition at every boot, so Argon's normal install script is lost
  after a restart. This app downloads the official Argon scripts into its own data folder and
  keeps them running. Updates to those scripts are installed only when you press the button, and
  the previous version comes back automatically if the new one does not work.


  The fan and button service has no network, but it has access to I2C, GPIO and the system D-Bus
  to reboot or shut down. That is broad access to your Umbrel: install this app only if you accept
  it.
