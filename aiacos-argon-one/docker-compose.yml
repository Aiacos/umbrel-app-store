version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aiacos-argon-one_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/aiacos/argon-one:1.0.0
    restart: on-failure
    command: ["python3", "-u", "/app/web.py"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    volumes:
      - ${APP_DATA_DIR}/data/config:/data/config
      - ${APP_DATA_DIR}/data/run:/data/run
      - ${APP_DATA_DIR}/data/staging:/data/staging
      - ${APP_DATA_DIR}/data/argon:/data/argon:ro

  daemon:
    image: ghcr.io/aiacos/argon-one:1.0.0
    restart: on-failure
    command: ["python3", "-u", "/app/supervisor.py"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    # Lets root in this container write the data folder, which stays owned by the umbrel user.
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    devices:
      - /dev/i2c-1
      - /dev/gpiochip0
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /usr/lib/systemd/system-shutdown:/host-shutdown
