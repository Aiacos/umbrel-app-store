name: Build Argon ONE image

on:
  push:
    branches: [main]
    paths: ["argon-one/**", ".github/workflows/build-argon-one.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Read version
        run: echo "VERSION=$(cat argon-one/VERSION)" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: argon-one
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/aiacos/argon-one:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Show digest
        run: echo "ghcr.io/aiacos/argon-one:${VERSION}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
