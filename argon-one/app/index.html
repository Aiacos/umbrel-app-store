<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argon ONE</title>
<link rel="icon" href="data:,">
<style>
:root{--plate:#dfe3e6;--ink:#20262b;--soft:#59636b;--line:#b4bcc2;--well:#f0f2f4;--act:#0d6c7a;--on-act:#fff;--bad:#a8320c;--cool:#2b7bb5;--warm:#e2a428;--hot:#d9481c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--plate:#20262b;--ink:#dfe3e6;--soft:#9aa5ad;--line:#47525a;--well:#181d21;--act:#57b8c6;--on-act:#102226;--bad:#f0805c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--plate);color:var(--ink);font:400 1rem/1.5 Bahnschrift,"DIN Alternate","DIN 2014","Barlow","Roboto Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:58rem;margin:0 auto;padding:clamp(1.25rem,4vw,3rem) clamp(1rem,4vw,2.5rem) 4rem}
h1{font-size:2.6rem;line-height:1.1;font-weight:600;margin:0;letter-spacing:-.01em}
#summary{margin:.35rem 0 1.5rem;font-size:1.2rem;color:var(--soft);max-width:44rem}
h2{font-size:1.2rem;font-weight:600;margin:0 0 .6rem}
section{padding:1.75rem 0;border-top:1px solid var(--line)}
p{margin:.4rem 0;max-width:44rem}
.quiet{color:var(--soft)}
#notice{margin:0 0 1.5rem;padding:.75rem 1rem;border-left:4px solid var(--bad);background:var(--well)}
#notice[hidden]{display:none}
#curve{display:block;width:100%;height:auto;background:var(--well);border-radius:6px;touch-action:none;user-select:none}
#curve text{fill:var(--soft);font-size:13px}
#curve .now{fill:var(--ink);font-size:30px;font-weight:600}
#curve .axis{stroke:var(--line);stroke-width:1}
#curve .marker{stroke:var(--ink);stroke-width:1.5}
#curve .handle{fill:var(--plate);stroke:var(--ink);stroke-width:2.5;cursor:ew-resize}
#curve .handle:hover,#curve .handle.drag{fill:var(--act)}
table{border-collapse:collapse;margin:1rem 0 .5rem}
th{font-weight:400;color:var(--soft);text-align:left;padding:0 1rem .3rem 0}
td{padding:.2rem 1rem .2rem 0}
input[type=number]{width:5.5rem;font:inherit;padding:.35rem .5rem;color:inherit;background:var(--well);border:1px solid var(--line);border-radius:4px}
button{font:inherit;padding:.45rem 1rem;border-radius:4px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
button.primary{background:var(--act);border-color:var(--act);color:var(--on-act);font-weight:600}
button.plain{border:0;padding:.35rem .5rem;color:var(--soft);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.8rem}
#units{border:0;padding:0;margin:0}
#units legend{padding:0;margin-bottom:.6rem;font-weight:600;font-size:1.2rem}
#units label{display:inline-flex;gap:.4rem;align-items:center;margin-right:1.25rem}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1.5rem;margin:0}
dt{color:var(--soft)}dd{margin:0}
.bad{color:var(--bad)}
#files{margin:.5rem 0;padding-left:1.2rem}
pre{overflow:auto;max-height:24rem;padding:.75rem;background:var(--well);font-size:.8rem;border-radius:4px}
@media (max-width:40rem){#curve text{font-size:26px}#curve .now{font-size:46px}#curve .handle{r:22px;stroke-width:5}#curve .marker{stroke-width:3}}
@media (max-width:30rem){h1{font-size:2.1rem}input[type=number]{width:4.5rem}dl{grid-template-columns:1fr}dd{margin-bottom:.4rem}}
</style>
</head>
<body>
<main>
<h1>Argon ONE</h1>
<p id="summary" aria-live="polite"></p>
<p id="notice" role="alert" hidden></p>
<svg id="curve" viewBox="0 0 800 340" role="img"></svg>

<section aria-labelledby="fan-title">
  <h2 id="fan-title"></h2>
  <p class="quiet" id="fan-help"></p>
  <table>
    <thead><tr><th id="col-temp"></th><th id="col-speed"></th><th></th></tr></thead>
    <tbody id="points"></tbody>
  </table>
  <div class="row">
    <button id="add"></button>
    <button id="always"></button>
    <button id="defaults"></button>
    <button id="save" class="primary"></button>
    <span id="saved" class="quiet" aria-live="polite"></span>
  </div>
</section>

<section><fieldset id="units"><legend id="units-title"></legend>
  <label><input type="radio" name="units" value="C"> Celsius</label>
  <label><input type="radio" name="units" value="F"> Fahrenheit</label>
</fieldset></section>

<section aria-labelledby="case-title">
  <h2 id="case-title"></h2>
  <dl id="health"></dl>
</section>

<section aria-labelledby="update-title">
  <h2 id="update-title"></h2>
  <p id="update-state" aria-live="polite"></p>
  <ul id="files"></ul>
  <details id="diff-box" hidden><summary id="diff-title"></summary><pre id="diff"></pre></details>
  <div class="row">
    <button id="check"></button>
    <button id="install" class="primary" hidden></button>
    <button id="rollback" hidden></button>
  </div>
</section>
</main>
<script>
const T = {
  en: {
    summaryOff: (t, s) => `${t}. The fan is off and starts at ${s}.`,
    summaryOn: (t, d) => `${t}. The fan is running at ${d}%.`,
    summaryWait: "Waiting for the fan service.",
    fan: "Fan curve", fanHelp: "Drag a point on the curve or type the values. Each speed applies from its temperature upwards; below the lowest one the fan is off.",
    temp: "From", speed: "Speed (%)", remove: "Remove", add: "Add point", always: "Keep always on", defaults: "Restore Argon defaults", save: "Save curve", saved: "Saved and applied.",
    pointsBad: "Use different temperatures, from 0 to 100 °C, and speeds from 30 to 100%.", units: "Temperature unit",
    case: "Case", service: "Fan service", button: "Power button", hook: "Power cut after shutdown", speedNow: "Fan speed",
    ok: "Working", waiting: "Waiting", active: "Ready", hookNo: "Not ready: the case stays powered after a shutdown",
    update: "Argon scripts", version: v => `Installed version ${v}.`, none: "Not installed yet.", check: "Check for updates", install: "Install update", rollback: v => `Go back to version ${v}`,
    upToDate: v => `Version ${v} is the latest.`, available: (o, n) => `Available: version ${n}, you have ${o}.`, sameVersion: n => `Argon changed these files without changing version number (${n}).`, checking: "Checking.", applying: "Installing and testing. This takes about 10 seconds.",
    files: (f, n) => `${f}: ${n} changed lines`, diff: "Show the changes",
    r: { applied: v => `Installed version ${v}.`, restored: v => `Back to version ${v}.`, "rolled-back": v => `The update did not work, so version ${v} is back in place.`, rejected: () => "The download contained invalid files, so nothing changed.", failed: () => "The first install did not work. Check that this is an Argon ONE case on a Raspberry Pi 5, then restart the app.", broken: () => "Neither version works. Restart the app from the Umbrel home screen.", "rollback-failed": v => `That version did not work, so ${v} stayed in place.`, "no-backup": () => "There is no earlier version to go back to." },
    p: { "not-installed": "Downloading the Argon scripts. The fan is not controlled until they are ready.", daemon: "The fan service stopped. It restarts by itself; if this stays, restart the app from the Umbrel home screen.", button: "The power button is not connected to the app. Restart the app from the Umbrel home screen.", case: "The case does not respond on I2C. Check that this is an Argon ONE case, then restart the app.", offline: "The fan service is not responding. Restart the app from the Umbrel home screen.", "no-hardware": "No Argon ONE case found. This app needs a Raspberry Pi 5 in an Argon ONE case, with the case's board connected; the fan and the button are not controlled." },
    netError: "Could not download the Argon scripts. Check the internet connection and try again.", failedAction: "That did not work. Reload the page and try again."
  },
  it: {
    summaryOff: (t, s) => `${t}. La ventola è ferma e parte a ${s}.`,
    summaryOn: (t, d) => `${t}. La ventola gira al ${d}%.`,
    summaryWait: "In attesa del servizio della ventola.",
    fan: "Curva della ventola", fanHelp: "Trascina un punto sulla curva o scrivi i valori. Ogni velocità vale da quella temperatura in su; sotto la più bassa la ventola è ferma.",
    temp: "Da", speed: "Velocità (%)", remove: "Rimuovi", add: "Aggiungi punto", always: "Tieni sempre accesa", defaults: "Ripristina i valori Argon", save: "Salva la curva", saved: "Salvata e applicata.",
    pointsBad: "Usa temperature diverse tra loro, da 0 a 100 °C, e velocità da 30 a 100%.", units: "Unità di temperatura",
    case: "Case", service: "Servizio della ventola", button: "Pulsante di accensione", hook: "Stacco della corrente dopo lo spegnimento", speedNow: "Velocità della ventola",
    ok: "Funziona", waiting: "In attesa", active: "Pronto", hookNo: "Non pronto: il case resta alimentato dopo lo spegnimento",
    update: "Script Argon", version: v => `Versione installata: ${v}.`, none: "Non ancora installati.", check: "Cerca aggiornamenti", install: "Installa l'aggiornamento", rollback: v => `Torna alla versione ${v}`,
    upToDate: v => `La versione ${v} è la più recente.`, available: (o, n) => `Disponibile la versione ${n}, hai la ${o}.`, sameVersion: n => `Argon ha cambiato questi file senza cambiare numero di versione (${n}).`, checking: "Controllo in corso.", applying: "Installazione e prova in corso. Serve una decina di secondi.",
    files: (f, n) => `${f}: ${n} righe cambiate`, diff: "Mostra le modifiche",
    r: { applied: v => `Versione ${v} installata.`, restored: v => `Tornato alla versione ${v}.`, "rolled-back": v => `L'aggiornamento non funzionava, quindi è tornata la versione ${v}.`, rejected: () => "Il download conteneva file non validi, quindi non è cambiato nulla.", failed: () => "La prima installazione non ha funzionato. Controlla che sia un case Argon ONE su Raspberry Pi 5, poi riavvia l'app.", broken: () => "Nessuna delle due versioni funziona. Riavvia l'app dalla home di Umbrel.", "rollback-failed": v => `Quella versione non funzionava, quindi è rimasta la ${v}.`, "no-backup": () => "Non c'è una versione precedente a cui tornare." },
    p: { "not-installed": "Sto scaricando gli script Argon. La ventola non è controllata finché non sono pronti.", daemon: "Il servizio della ventola si è fermato. Riparte da solo; se il messaggio resta, riavvia l'app dalla home di Umbrel.", button: "Il pulsante di accensione non è collegato all'app. Riavvia l'app dalla home di Umbrel.", case: "Il case non risponde su I2C. Controlla che sia un case Argon ONE, poi riavvia l'app.", offline: "Il servizio della ventola non risponde. Riavvia l'app dalla home di Umbrel.", "no-hardware": "Nessun case Argon ONE trovato. Questa app richiede un Raspberry Pi 5 in un case Argon ONE con la scheda del case collegata; ventola e pulsante non sono controllati." },
    netError: "Non riesco a scaricare gli script Argon. Controlla la connessione a internet e riprova.", failedAction: "Non ha funzionato. Ricarica la pagina e riprova."
  }
};
const lang = (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
const L = T[lang];
document.documentElement.lang = lang;
const $ = id => document.getElementById(id);
const DEFAULTS = [[55, 30], [60, 55], [65, 100]];
let S = null, points = [], dirty = false, drag = null, units = "C", checking = false;

for (const [id, text] of Object.entries({"fan-title": L.fan, "fan-help": L.fanHelp, "col-speed": L.speed, add: L.add, always: L.always, defaults: L.defaults, save: L.save, "units-title": L.units, "case-title": L.case, "update-title": L.update, check: L.check, install: L.install, "diff-title": L.diff})) $(id).textContent = text;

const toUnit = c => units === "F" ? Math.round(c * 9 / 5 + 32) : Math.round(c);
const fromUnit = v => units === "F" ? Math.round((v - 32) * 5 / 9) : v;
const fmt = c => units === "F" ? `${Math.round(c * 9 / 5 + 32)} °F` : `${Math.round(c)} °C`;
const fmtNow = c => { const v = units === "F" ? c * 9 / 5 + 32 : c; return `${v.toFixed(1).replace(".", lang === "it" ? "," : ".")} °${units}`; };

// Curve geometry: 25-85 °C on the x axis, 0-100% on the y axis.
const X0 = 58, X1 = 784, Y0 = 296, Y1 = 22, TMIN = 25, TMAX = 85;
const x = t => X0 + (Math.min(TMAX, Math.max(TMIN, t)) - TMIN) / (TMAX - TMIN) * (X1 - X0);
const y = s => Y0 - s / 100 * (Y0 - Y1);

function drawCurve() {
  const svg = $("curve"), temp = S && S.argon.temperature;
  const pts = [...points].sort((a, b) => a[0] - b[0]);
  let line = `M${X0} ${Y0}`, cur = 0;
  for (const [t, s] of pts) { line += `L${x(t)} ${y(cur)}L${x(t)} ${y(s)}`; cur = s; }
  line += `L${X1} ${y(cur)}`;
  let ticks = "";
  for (let t = 30; t <= 80; t += 10) ticks += `<line class="axis" x1="${x(t)}" x2="${x(t)}" y1="${Y0}" y2="${Y0 + 6}"/><text x="${x(t)}" y="${Y0 + 24}" text-anchor="middle">${toUnit(t)}°</text>`;
  for (const s of [0, 50, 100]) ticks += `<line class="axis" x1="${X0}" x2="${X1}" y1="${y(s)}" y2="${y(s)}" opacity=".5"/><text x="${X0 - 10}" y="${y(s) + 5}" text-anchor="end">${s}%</text>`;
  let marker = "";
  if (temp != null) {
    const mx = x(temp), right = mx < (X0 + X1) / 2;
    marker = `<line class="marker" x1="${mx}" x2="${mx}" y1="${Y1 - 8}" y2="${Y0}"/><text class="now" x="${mx + (right ? 10 : -10)}" y="${Y1 + 24}" text-anchor="${right ? "start" : "end"}">${fmtNow(temp)}</text>`;
  }
  const handles = pts.map(([t, s]) => `<circle class="handle${drag && drag.point[0] === t && drag.point[1] === s ? " drag" : ""}" data-i="${points.findIndex(p => p[0] === t && p[1] === s)}" cx="${x(t)}" cy="${y(s)}" r="9"/>`).join("");
  svg.innerHTML = `<defs><linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="${x(35)}" x2="${x(75)}" y1="0" y2="0"><stop offset="0" stop-color="var(--cool)"/><stop offset=".55" stop-color="var(--warm)"/><stop offset="1" stop-color="var(--hot)"/></linearGradient></defs>${ticks}<path d="${line}L${X1} ${Y0}Z" fill="url(#heat)" opacity=".28"/><path d="${line}" fill="none" stroke="url(#heat)" stroke-width="4" stroke-linejoin="round"/>${marker}${handles}`;
  svg.setAttribute("aria-label", pts.map(([t, s]) => `${fmt(t)}: ${s}%`).join(", "));
}

function drawRows() {
  $("col-temp").textContent = `${L.temp} (°${units})`;
  const body = $("points"); body.textContent = "";
  points.forEach((p, i) => {
    const row = body.insertRow();
    const a = document.createElement("input"), b = document.createElement("input"), del = document.createElement("button");
    a.type = b.type = "number"; a.value = toUnit(p[0]); b.value = p[1]; a.min = units === "F" ? 32 : 0; a.max = units === "F" ? 212 : 100; b.min = 30; b.max = 100;
    a.setAttribute("aria-label", `${L.temp} ${i + 1}`); b.setAttribute("aria-label", `${L.speed} ${i + 1}`);
    a.oninput = () => { p[0] = fromUnit(+a.value); changed(); };
    b.oninput = () => { p[1] = +b.value; changed(); };
    del.textContent = L.remove; del.className = "plain"; del.disabled = points.length < 2;
    del.onclick = () => { points.splice(i, 1); changed(); drawRows(); };
    row.insertCell().append(a); row.insertCell().append(b); row.insertCell().append(del);
  });
  $("add").disabled = points.length >= 8;
}

function changed() { dirty = true; $("saved").textContent = ""; drawCurve(); }
function setPoints(list) { points = list.map(p => [...p]); changed(); drawRows(); }

const svgEl = $("curve");
svgEl.addEventListener("pointerdown", e => {
  if (!e.target.classList.contains("handle")) return;
  drag = {point: points[+e.target.dataset.i]};
  svgEl.setPointerCapture(e.pointerId);
});
svgEl.addEventListener("pointermove", e => {
  if (!drag) return;
  const box = svgEl.getBoundingClientRect(), k = 800 / box.width;
  const px = (e.clientX - box.left) * k, py = (e.clientY - box.top) * k;
  let t = Math.round(TMIN + (px - X0) / (X1 - X0) * (TMAX - TMIN));
  t = Math.min(TMAX, Math.max(TMIN, t));
  if (!points.some(p => p !== drag.point && p[0] === t)) drag.point[0] = t;
  drag.point[1] = Math.min(100, Math.max(30, Math.round((Y0 - py) / (Y0 - Y1) * 100 / 5) * 5));
  changed();
});
const endDrag = () => { if (drag) { drag = null; points.sort((a, b) => a[0] - b[0]); drawCurve(); drawRows(); } };
svgEl.addEventListener("pointerup", endDrag);
svgEl.addEventListener("pointercancel", endDrag);

$("add").onclick = () => { let t = points.length ? Math.max(...points.map(p => p[0])) + 5 : 55; if (t > 100) t = 50; while (points.some(p => p[0] === t)) t--; setPoints([...points, [t, 60]]); };
$("always").onclick = () => setPoints([[1, 30]]);
$("defaults").onclick = () => setPoints(DEFAULTS);

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  S = await r.json(); render();
}
function failed(error) {
  $("notice").textContent = error.message === "points" ? L.pointsBad : L.failedAction; $("notice").hidden = false; notified = true;
}
let notified = false;
$("save").onclick = async () => {
  const list = points.map(p => [Math.round(p[0]), Math.round(p[1])]);
  const clean = list.every(([t, s]) => t >= 0 && t <= 100 && s >= 30 && s <= 100) && new Set(list.map(p => p[0])).size === list.length;
  if (!clean) { failed(new Error("points")); return; }
  try { dirty = false; await post("/api/fan", {points: list}); notified = false; $("saved").textContent = L.saved; } catch (e) { dirty = true; failed(e); }
};
document.querySelectorAll("input[name=units]").forEach(radio => radio.onchange = () => post("/api/units", {units: radio.value}).catch(failed));
$("check").onclick = async () => { checking = true; render(); try { await post("/api/update/check"); } catch (e) { failed(e); } checking = false; render(); };
$("install").onclick = () => post("/api/update/apply").catch(failed);
$("rollback").onclick = () => post("/api/update/rollback").catch(failed);

function row(term, text, bad) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = term; dd.textContent = text; if (bad) dd.className = "bad"; $("health").append(dt, dd); }

function render() {
  if (!S) return;
  const a = S.argon || {}, u = S.update;
  if (S.units !== units) { units = S.units; drawRows(); }
  document.querySelectorAll("input[name=units]").forEach(r => r.checked = r.value === units);
  if (!dirty && !drag && JSON.stringify(points) !== JSON.stringify(S.points)) { points = S.points.map(p => [...p]); drawRows(); }
  drawCurve();

  const lowest = [...S.points].sort((p, q) => p[0] - q[0])[0];
  $("summary").textContent = a.temperature == null || !S.online ? L.summaryWait : a.duty > 0 ? L.summaryOn(fmtNow(a.temperature), a.duty) : L.summaryOff(fmtNow(a.temperature), fmt(lowest[0]));

  const problem = !S.online ? "offline" : a.problem;
  if (!notified) { $("notice").textContent = problem ? L.p[problem] : ""; $("notice").hidden = !problem; }

  $("health").textContent = "";
  const down = !S.online || problem === "not-installed" || problem === "no-hardware";
  row(L.service, down ? L.waiting : problem === "daemon" ? L.p.daemon : L.ok, !down && problem === "daemon");
  row(L.button, down ? L.waiting : problem === "button" ? L.p.button : L.active, !down && problem === "button");
  row(L.speedNow, a.duty == null ? "-" : `${a.duty}%`, problem === "case");
  row(L.hook, a.hook_installed ? L.active : down ? L.waiting : L.hookNo, !down && !a.hook_installed);

  const busy = u.busy, have = a.version, res = u.result || {};
  let text = have ? L.version(have) : L.none;
  if (checking) text = L.checking;
  else if (busy) text = L.applying;
  else if (u.error) text = L.netError;
  else if (u.available) text = u.available.version === have ? L.sameVersion(have) : L.available(have || "-", u.available.version);
  else if (res.state && L.r[res.state] && S.time - res.time < 600) text = L.r[res.state](res.version || have);
  else if (u.checked_at) text = L.upToDate(have);
  $("update-state").textContent = text;

  const files = $("files"); files.textContent = "";
  for (const f of (u.available && !busy ? u.available.files : [])) { const li = document.createElement("li"); li.textContent = L.files(f.file, f.lines); files.append(li); }
  files.hidden = !files.children.length;
  $("diff-box").hidden = !(u.available && !busy);
  $("diff").textContent = u.available ? u.available.diff : "";
  $("install").hidden = !(u.available && !busy);
  $("check").disabled = checking || busy;
  const prev = a.previous_version;
  $("rollback").hidden = !prev || busy;
  if (prev) $("rollback").textContent = L.rollback(prev);
}

async function poll() {
  try { const r = await fetch("/api/status"); if (r.ok) { S = await r.json(); render(); } } catch (e) {}
}
points = DEFAULTS.map(p => [...p]); drawRows(); drawCurve();
poll(); setInterval(poll, 5000);
</script>
</body>
</html>
